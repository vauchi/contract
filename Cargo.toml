[package]
name = "vauchi-contract"
version = "0.95.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/vauchi/contract"
authors = ["Vauchi Contributors"]
description = "The Vauchi shell contract: the Command and Event protocol, its JSON schema and the fixture corpus (ADR-066, ADR-078)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
schemars = { version = "0.8", optional = true }

[[bin]]
name = "gen-schema"
required-features = ["schema-gen"]

[features]
default = []
# JSON Schema generation (schema/vauchi-contract-v1.json is generated from it)
schema-gen = ["schemars"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
