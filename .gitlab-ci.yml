# The shell contract (ADR-078): format, clippy and the tests on every MR and
# on main; the committed schema must be the generated one (a test), and the
# schema must not break a shell built against the last release
# (contract:breaking, ADR-078 item 8). Templates come from vauchi/scripts,
# pinned like the other repositories.

include:
  - project: 'vauchi/scripts'
    ref: 618760e5c3682005e505e42160fb59c059100e40
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/auto-tag.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/timeouts.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'

stages:
  - auto-tag
  - lint
  - test
  - deploy

# A version bump merged to main is the release: the job pushes
# v<Cargo.toml version> when that tag does not exist yet, so the tag always
# sits on the merged commit (private#1045).
auto-tag:version:
  extends: .auto-tag

variables:
  VAUCHI_SCRIPTS_REF: "618760e5c3682005e505e42160fb59c059100e40"

lint:format:
  extends: [.rust-runner-nocache, .lint-format, .mr-or-main, .timeout-quick]
  needs: []

lint:clippy:
  extends: [.rust-runner-readonly, .mr-or-main, .timeout-standard]
  stage: lint
  needs: []
  script:
    - cargo clippy --all-targets --features schema-gen -- -D warnings

security:vet:
  extends: [.rust-runner-readonly, .mr-or-main, .timeout-quick]
  stage: lint
  needs: []
  script:
    - command -v cargo-vet
    - cargo vet --locked

# The breaking-change check is pure Python; it is tested on every MR that
# touches it, and on main, with seeded removals that must fail (CC-27).
check:schema-breaking:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  before_script:
    - apk add --no-cache python3 py3-tomli
  script:
    - sh ci/tests/check-schema-breaking.test.sh
    - python3 ci/tests/schema-restrictions.test.py
    - python3 ci/tests/catalog-evidence.test.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ci/check-schema-breaking.py
        - ci/tests/check-schema-breaking.test.sh
        - ci/tests/schema-restrictions.test.py
        - ci/fetch-screen-catalog.py
        - ci/tests/catalog-evidence.test.py
        - fixtures/screen_catalog_v1.json
        - fixtures/screen_catalog_inventory_v1.json
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# `cargo test --features schema-gen` includes tests/schema_fresh.rs: the
# committed schema/vauchi-contract-v1.json must equal the generated one.
test:unit:
  extends: [.rust-runner, .mr-or-main, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
  script:
    - cargo test --all-targets --features schema-gen

contract:report:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache python3 git
  script:
    - python3 ci/tests/contract-report.test.py
    - python3 ci/contract-report.py catalog schema/vauchi-contract-v1.json --check catalog/vocabulary.md
    - |
      set -eu
      mkdir -p target/contract-report
      baseline_ref="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
      set --
      if [ -n "$baseline_ref" ] && [ "$baseline_ref" != 0000000000000000000000000000000000000000 ]; then
        git show "$baseline_ref:schema/vauchi-contract-v1.json" > target/contract-report/baseline-schema.json
        mkdir -p target/contract-report/baseline
        git archive --format=tar --output=target/contract-report/baseline-fixtures.tar "$baseline_ref" fixtures
        tar -xf target/contract-report/baseline-fixtures.tar -C target/contract-report/baseline
        set -- --baseline target/contract-report/baseline-schema.json --baseline-fixtures target/contract-report/baseline/fixtures
      fi
      python3 ci/contract-report.py report schema/vauchi-contract-v1.json "$@" --output target/contract-report/report.md
      python3 ci/contract-report.py report schema/vauchi-contract-v1.json "$@" --format json --output target/contract-report/report.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - target/contract-report/report.md
      - target/contract-report/report.json
      - target/contract-report/baseline-schema.json
      - target/contract-report/baseline-fixtures.tar
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The two envelopes may name no Vauchi feature or domain concept (ADR-066):
# the test reads the retired vocabulary from vauchi/scripts'
# humble_check_rules.json, so the scripts checkout is cloned beside the
# run, as Core's validate:schema job did while the types were Core's.
validate:schema:
  extends: [.rust-runner, .mr-or-main, .timeout-standard]
  stage: test
  needs: []
  before_script:
    - !reference [.self-hosted, before_script]
    - |
      VAUCHI_CI_SCRIPTS_DIR=$(mktemp -d)
      export VAUCHI_CI_SCRIPTS_DIR
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" init -q
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" remote add origin https://gitlab.com/vauchi/scripts.git
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" fetch -q --depth=1 origin "${VAUCHI_SCRIPTS_REF}"
      git -C "${VAUCHI_CI_SCRIPTS_DIR}" checkout -q --detach FETCH_HEAD
      test -f "$VAUCHI_CI_SCRIPTS_DIR/scripts/humble_check_rules.json"
  script:
    - cargo test --features schema-gen --test domain_vocabulary_boundary

# The schema may only grow between releases: compared with the last v* tag,
# a removed property or variant, a retyped field, a new required property
# or a tightened bound fails the MR. The first release has no previous tag
# and passes with that said.
contract:breaking:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache python3 git
  script:
    - |
      set -eu
      git fetch --quiet --tags origin
      # One ref from git itself: `git tag | head -n 1` let head close the
      # pipe while git still wrote, and the job died with SIGPIPE (141).
      last=$(git for-each-ref --count=1 --sort=-v:refname --format='%(refname:short)' 'refs/tags/v*')
      if [ -z "$last" ]; then
        echo "no previous release tag: nothing to compare against"
        exit 0
      fi
      git show "$last:schema/vauchi-contract-v1.json" > /tmp/last-schema.json
      echo "comparing against $last"
      python3 ci/check-schema-breaking.py /tmp/last-schema.json schema/vauchi-contract-v1.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

contract:swift:
  stage: test
  tags: [macos-host, self-hosted]
  script:
    - python3 scripts/build-swift-oracle.py
    - swiftformat Sources Tests --lint
    - swiftlint lint --strict --quiet
    - swift test
    - swift test --sanitize=thread --filter ContractJSONTests.testConcurrentDecodingDoesNotShareBoundaryState
    - xcrun swift build --sdk /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator26.4.sdk --triple arm64-apple-ios15.0-simulator
    - xcrun swift build --sdk /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX26.4.sdk --triple arm64-apple-macosx14.0
    - python3 ci/tests/swift-generation.test.py
    - bash scripts/check-swift-generation.sh
    - python3 ci/tests/native-contract-evidence.test.py
    - python3 ci/native-contract-evidence.py target/native-products.md --product swift --write --validate
  artifacts:
    when: always
    paths:
      - target/native-products.md
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# What the Rust decoder accepts, rejects and writes back for the oracle
# messages; the C# job has no Rust toolchain and reads the answers.
oracle:rust:
  extends: [.rust-runner, .timeout-standard]
  stage: test
  needs: []
  script:
    - python3 scripts/build-swift-oracle.py
  artifacts:
    expire_in: 1 day
    paths:
      - cache/oracle/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The C# product (SC-78, private#772): the generated files are current,
# compile with the trim and ahead-of-time analyzers as errors, agree with
# the Rust decoder on every oracle message and replay the shared fixture.
# The evidence lines are written only after those steps passed.
contract:csharp:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0-alpine3.21
  tags: [docker]
  needs: ["oracle:rust"]
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
  before_script:
    - apk add --no-cache python3
  script:
    - python3 ci/tests/csharp-generation.test.py
    - python3 scripts/generate-csharp.py
    - dotnet restore csharp/Vauchi.Contract.Tests/Vauchi.Contract.Tests.csproj --locked-mode
    - dotnet build csharp/Vauchi.Contract.Tests/Vauchi.Contract.Tests.csproj -c Release --no-restore
    - dotnet test csharp/Vauchi.Contract.Tests/Vauchi.Contract.Tests.csproj -c Release --no-build
    - python3 ci/tests/native-contract-evidence.test.py
    - python3 ci/native-contract-evidence.py target/native-products-csharp.md --product csharp --write --validate
    - |
      set -eu
      version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | sed -n 1p)
      test -n "$version"
      dotnet pack csharp/Vauchi.Contract/Vauchi.Contract.csproj -c Release -p:Version="$version" -o target/nuget
  artifacts:
    when: always
    paths:
      - target/native-products-csharp.md
      - target/nuget/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# A release tag publishes the package the tag's own pipeline built and
# tested, to this project's NuGet registry; windows-hw and windows-app
# restore it from there.
publish:csharp:
  stage: deploy
  image: mcr.microsoft.com/dotnet/sdk:8.0-alpine3.21
  tags: [docker]
  needs: ["contract:csharp"]
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
  script:
    - |
      set -eu
      package="target/nuget/Vauchi.Contract.${CI_COMMIT_TAG#v}.nupkg"
      if [ ! -f "$package" ]; then
        echo "ERROR: tag $CI_COMMIT_TAG has no package $package; Cargo.toml and the tag disagree"
        exit 1
      fi
      dotnet nuget add source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json" --name gitlab --username gitlab-ci-token --password "${CI_JOB_TOKEN}" --store-password-in-clear-text
      # A retried job finds its package already there and must not fail on it.
      dotnet nuget push "$package" --source gitlab --skip-duplicate
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The Kotlin package is independent of Core and consumes the same Rust
# oracle as C#. Its own Gradle wrapper and dependency locks are committed.
contract:kotlin:
  # vci02-ok: .timeout-standard defines only timeout, with no setup to retain.
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/eclipse-temurin:17-jdk-alpine
  tags: [docker]
  extends: .timeout-standard
  needs: ["oracle:rust"]
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-kotlin"
  cache:
    key:
      files:
        - kotlin/gradle.lockfile
        - kotlin/gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle-kotlin/caches/
      - .gradle-kotlin/wrapper/
  before_script:
    - apk add --no-cache python3 bash
  script:
    - python3 ci/tests/kotlin-generation.test.py
    - python3 scripts/generate-kotlin.py
    - ./kotlin/gradlew -p kotlin --no-daemon lintKotlin test boundedMemoryTest jar sourcesJar generatePomFileForContractPublication generateMetadataFileForContractPublication
    - python3 ci/tests/native-contract-evidence.test.py
    - python3 ci/native-contract-evidence.py target/native-products-kotlin.md --product kotlin --write --validate
  artifacts:
    when: always
    reports:
      junit: kotlin/build/test-results/**/TEST-*.xml
    paths:
      - kotlin/build/libs/
      - kotlin/build/publications/contract/
      - kotlin/build/reports/tests/
      - target/native-products-kotlin.md
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

publish:kotlin:
  # vci02-ok: .timeout-standard defines only timeout, with no setup to retain.
  stage: deploy
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/eclipse-temurin:17-jdk-alpine
  tags: [docker]
  extends: .timeout-standard
  needs: ["oracle:rust", "contract:kotlin"]
  before_script:
    - apk add --no-cache bash
  script:
    - ./kotlin/gradlew -p kotlin --no-daemon publishContractPublicationToGitLabRepository
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The pipeline badge the group README shows
# (https://vauchi.gitlab.io/contract/badges/pipeline.json) comes from the
# shared template: a Pages deploy on main, no script of this repository's
# own. Pages visibility must be enabled on the project for shields.io to
# read it.
pages:
  extends: .badges-pages

github-mirror:
  extends: .github-mirror
